<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Myxsi Centrado</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* ===== FONDO CON BRILLO ===== */
    .background-glow {
        position: fixed;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle at 20% 20%, #e879f9 0%, #d946ef 30%, transparent 65%),
                    radial-gradient(circle at 80% 80%, #38bdf8 0%, #06b6d4 35%, transparent 65%);
        filter: blur(60px);
        opacity: 0;
        animation: glowAppear 2s ease-out 0.2s forwards,
                   glowPulse 8s ease-in-out 2.2s infinite alternate;
        pointer-events: none;
        z-index: 0;
    }

    @keyframes glowAppear {
        0%   { opacity: 0; transform: scale(0.8); }
        100% { opacity: 0.7; transform: scale(1); }
    }

    @keyframes glowPulse {
        0%   { opacity: 0.55; filter: blur(55px); transform: scale(0.97); }
        100% { opacity: 0.8;  filter: blur(70px); transform: scale(1.04); }
    }

    /* ===== CONTENEDOR LOGO ===== */
    .logo {
        position: relative;
        width: 700px;
        height: 700px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
    }

    .logo::before {
        content: "";
        position: absolute;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: radial-gradient(
            circle,
            rgba(119, 67, 255, 0.42) 0%,
            rgba(152, 78, 255, 0.25) 35%,
            rgba(0, 214, 255, 0.14) 58%,
            transparent 74%
        );
        filter: blur(25px);
        z-index: 0;
        opacity: 0;
        animation: haloAppear 1.6s ease-out 0.1s forwards;
    }

    @keyframes haloAppear {
        0%   { opacity: 0; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1); }
    }

    /* ===== CÍRCULO CENTRAL ===== */
    .logo-circle {
        position: relative;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        overflow: hidden;
        background: radial-gradient(
            circle at 25% 18%,
            #9a4cff 0%,
            #814cf5 25%,
            #686cf1 48%,
            #3f9ff0 72%,
            #00cce9 100%
        );
        box-shadow: 0 0 35px rgba(124, 67, 255, 0.28), 0 0 70px rgba(0, 205, 240, 0.16);
        z-index: 1;
        opacity: 0;
        transform: scale(0.4) rotate(-45deg);
        animation: circleEntrance 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }

    @keyframes circleEntrance {
        0% {
            opacity: 0;
            transform: scale(0.4) rotate(-45deg);
        }
        60% {
            opacity: 1;
        }
        100% {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
    }

    .logo-circle::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
            circle at 28% 20%,
            rgba(255,255,255,0.08),
            transparent 35%
        );
        pointer-events: none;
    }

    /* ===== LA M CENTRAL ===== */
    .m-logo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
    }

    .m-logo path {
        fill: none;
        stroke: #ffffff;
        stroke-width: 57;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 700;
        stroke-dashoffset: 700;
        animation: drawM 1.2s cubic-bezier(0.65, 0, 0.35, 1) 0.9s forwards;
    }

    @keyframes drawM {
        to { stroke-dashoffset: 0; }
    }

    /* ===== ICONOS ALREDEDOR ===== */
    .detail {
        position: absolute;
        width: 110px;
        height: 110px;
        border-radius: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 7;
        backdrop-filter: blur(4px);
        opacity: 0;
        /* Estado inicial: colapsados en el centro para el efecto remolino */
        transform: scale(0.2) rotate(-90deg);
        animation: swirlIn 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                   floatIcon 4.5s ease-in-out infinite;
        transition: box-shadow 0.4s ease;
    }

    /* Entrada tipo remolino */
    @keyframes swirlIn {
        0% {
            opacity: 0;
            transform: scale(0.2) rotate(-90deg);
        }
        60% {
            opacity: 1;
        }
        100% {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
    }

    /* Flotación suave y lenta */
    @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
    }

    /* Retrasos escalonados: los iconos salen uno tras otro desde el centro */
    .study  { animation-delay: 0.45s, 2.2s; }
    .work   { animation-delay: 0.60s, 2.8s; }
    .write  { animation-delay: 0.75s, 3.4s; }
    .people { animation-delay: 0.90s, 4.0s; }

    .detail svg {
        width: 58px;
        height: 58px;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* Hover sutil, sin ruido visual */
    .detail:hover {
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    /* Posiciones separadas del círculo */
    .study {
        left: 45px;
        top: 45px;
        background: linear-gradient(145deg, rgba(224, 248, 237, 0.96), rgba(235, 251, 244, 0.90));
        box-shadow: 0 8px 26px rgba(35, 170, 110, 0.14);
    }
    .study svg { stroke: #0ea66a; }

    .work {
        right: 45px;
        top: 45px;
        background: linear-gradient(145deg, rgba(227, 241, 255, 0.96), rgba(238, 247, 255, 0.90));
        box-shadow: 0 8px 26px rgba(40, 125, 235, 0.14);
    }
    .work svg { stroke: #1178ed; }

    .write {
        left: 45px;
        bottom: 45px;
        background: linear-gradient(145deg, rgba(255, 229, 247, 0.96), rgba(255, 241, 251, 0.90));
        box-shadow: 0 8px 26px rgba(225, 70, 165, 0.14);
    }
    .write svg { stroke: #e349a6; }

    .people {
        right: 45px;
        bottom: 45px;
        background: linear-gradient(145deg, rgba(255, 245, 217, 0.96), rgba(255, 249, 231, 0.90));
        box-shadow: 0 8px 26px rgba(235, 170, 25, 0.14);
    }
    .people svg { stroke: #efa900; }

    /* ===== CHISPAS ===== */
    .spark {
        position: absolute;
        z-index: 6;
        line-height: 1;
        pointer-events: none;
        opacity: 0;
        animation: sparkAppear 1s ease-out forwards,
                   sparkGlow 4s ease-in-out infinite;
    }

    @keyframes sparkAppear {
        0%   { opacity: 0; transform: scale(0.3); }
        100% { opacity: 0.7; transform: scale(1); }
    }

    /* Brillo suave y lento, sin parpadeo agresivo */
    @keyframes sparkGlow {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 0.85; }
    }

    .spark-1 {
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #b7c6ff;
        animation-delay: 1.5s, 2.5s;
    }

    .spark-2 {
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #a96cff;
        font-size: 30px;
        animation-delay: 1.6s, 3.0s;
    }

    .spark-3 {
        right: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #a678ff;
        font-size: 28px;
        animation-delay: 1.7s, 3.5s;
    }

    .spark-4 {
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        color: #c4d1ff;
        font-size: 20px;
        animation-delay: 1.8s, 4.0s;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
        .background-glow {
            width: 80vw;
            height: 80vw;
        }

        .logo {
            width: 90vw;
            height: 90vw;
        }
        .logo-circle {
            width: 70vw;
            height: 70vw;
        }
        .logo::before {
            width: 80vw;
            height: 80vw;
        }
        .m-logo path {
            stroke-width: 8vw;
        }

        .detail {
            width: 16vw;
            height: 16vw;
            border-radius: 4vw;
        }
        .detail svg {
            width: 8.5vw;
            height: 8.5vw;
        }

        .study { left: 1.5vw; top: 1.5vw; }
        .work { right: 1.5vw; top: 1.5vw; }
        .write { left: 1.5vw; bottom: 1.5vw; }
        .people { right: 1.5vw; bottom: 1.5vw; }

        .spark-1 { width: 2vw; height: 2vw; top: 2.5vw; }
        .spark-2 { font-size: 4.5vw; left: 2.5vw; }
        .spark-3 { font-size: 4.2vw; right: 2.5vw; }
        .spark-4 { font-size: 3vw; bottom: 2.5vw; }
    }
</style>
</head>

<body>
    <div class="background-glow" aria-hidden="true"></div>

    <div class="logo">
        <div class="spark spark-1"></div>
        <div class="spark spark-2">+</div>
        <div class="spark spark-3">+</div>
        <div class="spark spark-4">✦</div>

        <div class="detail study">
            <svg viewBox="0 0 24 24">
                <path d="M3 9.5 L12 5 L21 9.5 L12 14 Z"/>
                <path d="M6 11.2 V16 C9 18.5 15 18.5 18 16 V11.2"/>
                <path d="M21 10 V15"/>
            </svg>
        </div>

        <div class="detail work">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="7" width="18" height="13" rx="2"/>
                <path d="M8 7 V5 C8 3.9 8.9 3 10 3 H14 C15.1 3 16 3.9 16 5 V7"/>
                <path d="M3 12 H21"/>
                <path d="M10 12 V14 H14 V12"/>
            </svg>
        </div>

        <div class="detail write">
            <svg viewBox="0 0 24 24">
                <path d="M4 20 L8.5 18.8 L19 8.3 C20.3 7 20.3 5.1 19 3.9 C17.8 2.7 15.9 2.7 14.7 3.9 L4.2 14.4 Z"/>
                <path d="M14.8 6 L18 9.2"/>
            </svg>
        </div>

        <div class="detail people">
            <svg viewBox="0 0 24 24">
                <circle cx="9" cy="8" r="3"/>
                <circle cx="17" cy="9" r="2.5"/>
                <path d="M3.5 19 C3.5 15.9 5.8 14 9 14 C12.2 14 14.5 15.9 14.5 19"/>
                <path d="M14 15 C17.5 14.5 20 16.2 20.5 19"/>
            </svg>
        </div>

        <div class="logo-circle">
            <svg class="m-logo" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                <path d="M 150 330 L 150 160 L 250 250 L 350 160 L 350 330"/>
            </svg>
        </div>
    </div>
</body>
</html>
