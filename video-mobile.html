        // IMPORTACIÓN MULTIMEDIA (SECUENCIAL MAGNÉTICA)
        // =========================================================================
        async function handleFileInput(files) {
            if (!files || !files.length) return;

            for (const file of files) {
                const url = URL.createObjectURL(file);
                const isVideo = file.type.startsWith('video');
                const isAudio = file.type.startsWith('audio');
                const isImg = file.type.startsWith('image');
                const clipId = 'clip_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);

                if (isVideo) {
                    const videoEl = document.createElement('video');
                    videoEl.src = url;
                    videoEl.crossOrigin = 'anonymous';
                    videoEl.muted = false;
                    videoEl.playsInline = true;
                    await new Promise(res => { videoEl.onloadedmetadata = () => res(); videoEl.onerror = () => res(); });
                    mediaCache.set(clipId, videoEl);

                    projectState.clips.push({
                        id: clipId,
                        track: 'track-video1',
                        type: 'video',
                        title: file.name.substring(0, 18),
                        start: 999999, // enforceMagneticMainTrack lo colocará en orden al final
                        duration: videoEl.duration || 5.0,
                        speed: 1.0,
                        opacity: 1.0
                    });
                } else if (isImg) {
                    const imgEl = new Image();
                    imgEl.src = url;
                    await new Promise(res => { imgEl.onload = () => res(); });
                    mediaCache.set(clipId, imgEl);

                    projectState.clips.push({
                        id: clipId,
                        track: 'track-video1',
                        type: 'image',
                        title: file.name.substring(0, 18),
                        start: 999999,
                        duration: 4.0,
                        opacity: 1.0
                    });
                } else if (isAudio) {
                    const audioEl = new Audio();
                    audioEl.src = url;
                    await new Promise(res => { audioEl.onloadedmetadata = () => res(); audioEl.onerror = () => res(); });
                    mediaCache.set(clipId, audioEl);

                    projectState.clips.push({
                        id: clipId,
                        track: 'track-audio1',
                        type: 'audio',
                        title: file.name.substring(0, 18),
                        start: projectState.currentTime,
                        duration: audioEl.duration || 10.0,
                        volume: 0.9
                    });
                }
            }

            enforceMagneticMainTrack();
            pushHistory();
            renderTimelineClips();
            renderFrame(projectState.currentTime);
        }

        async function handleOverlayInput(files) {
            if (!files || !files.length) return;

            for (const file of files) {
                const url = URL.createObjectURL(file);
                const isVideo = file.type.startsWith('video');
                const isImg = file.type.startsWith('image');
                const clipId = 'clip_ov_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);

                if (isVideo) {
                    const videoEl = document.createElement('video');
                    videoEl.src = url;
                    videoEl.crossOrigin = 'anonymous';
                    videoEl.muted = false;
                    videoEl.playsInline = true;
                    await new Promise(res => { videoEl.onloadedmetadata = () => res(); videoEl.onerror = () => res(); });
                    mediaCache.set(clipId, videoEl);

                    projectState.clips.push({
                        id: clipId,
                        track: 'track-overlay',
                        type: 'video',
                        title: 'PIP: ' + file.name.substring(0, 14),
                        start: projectState.currentTime,
                        duration: videoEl.duration || 5.0,
                        scale: 0.5,
                        x: 0,
                        y: 0,
                        opacity: 1.0
                    });
                } else if (isImg) {
                    const imgEl = new Image();
                    imgEl.src = url;
                    await new Promise(res => { imgEl.onload = () => res(); });
                    mediaCache.set(clipId, imgEl);

                    projectState.clips.push({
                        id: clipId,
                        track: 'track-overlay',
                        type: 'image',
                        title: 'PIP: ' + file.name.substring(0, 14),
                        start: projectState.currentTime,
                        duration: 4.0,
                        scale: 0.5,
                        x: 0,
                        y: 0,
                        opacity: 1.0
                    });
                }
            }

            recalculateProjectDuration();
            pushHistory();
            renderTimelineClips();
            renderFrame(projectState.currentTime);
        }

        function handleAudioInput(files) {
            handleFileInput(files);
        }

        // =========================================================================
        // ACCIONES LATERALES
        // =========================================================================
        function toggleMuteAll() {
            projectState.isMutedAll = !projectState.isMutedAll;
            const btn = document.getElementById('btnMuteAll');
            if (projectState.isMutedAll) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark" style="color: #f87171;"></i><span>Silenciado</span>';
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i><span>Silenciar</span>';
            }
            syncAudioElements(projectState.isPlaying);
        }

        function setCoverFrame() {
            const coverUrl = canvas.toDataURL('image/jpeg', 0.85);
            projectState.coverFrame = coverUrl;
            saveProjectToDB();
            alert('¡Portada del proyecto actualizada con el fotograma actual!');
        }

        // =========================================================================
        // HISTORIAL: UNDO / REDO
        // =========================================================================
        function pushHistory() {
            if (historyIndex < historyStack.length - 1) {
                historyStack.splice(historyIndex + 1);
            }
            historyStack.push(JSON.stringify({
                clips: projectState.clips,
                aspectRatio: projectState.aspectRatio,
                duration: projectState.duration,
                activeShader: projectState.activeShader,
                activeFilter: projectState.activeFilter
            }));
            historyIndex++;
            updateUndoRedoUI();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreHistoryState(JSON.parse(historyStack[historyIndex]));
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                restoreHistoryState(JSON.parse(historyStack[historyIndex]));
            }
        }

        function restoreHistoryState(state) {
            projectState.clips = state.clips;
            projectState.aspectRatio = state.aspectRatio;
            projectState.duration = state.duration;
            projectState.activeShader = state.activeShader;
            projectState.activeFilter = state.activeFilter;

            setupCanvasDimensions();
            enforceMagneticMainTrack();
            renderTimelineClips();
            renderFrame(projectState.currentTime);
            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            document.getElementById('btnUndo').disabled = (historyIndex <= 0);
            document.getElementById('btnRedo').disabled = (historyIndex >= historyStack.length - 1);
        }

        function setupDesktopKeyboardEvents() {
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.contentEditable === 'true') return;

                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    seekTime(projectState.currentTime - 0.1);
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    seekTime(projectState.currentTime + 0.1);
                } else if (e.code === 'Delete' || e.code === 'Backspace') {
                    if (projectState.activeClipId) {
                        e.preventDefault();
                        deleteActiveClip();
                    }
                } else if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
                    e.preventDefault();
                    if (e.shiftKey) redo(); else undo();
                } else if ((e.ctrlKey || e.metaKey) && e.code === 'KeyY') {
                    e.preventDefault();
                    redo();
                } else if (e.code === 'Escape') {
                    deselectActiveClip();
                    closeDrawer();
                    closeExportModal();
                }
            });
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        async function saveProjectToDB() {
            const projectData = {
                id: projectState.id,
                title: projectState.title,
                ratio: projectState.aspectRatio,
                duration: projectState.duration,
                cover: projectState.coverFrame || null,
                clips: projectState.clips,
                updatedAt: Date.now()
            };

            if (window.MyxsiVideoDB) {
                try {
                    await window.MyxsiVideoDB.saveProject(projectData);
                } catch(e) {}
            }

            try {
                let projects = JSON.parse(localStorage.getItem('myxsi_video_projects') || '[]');
                const existingIdx = projects.findIndex(p => p.id === projectState.id);
                if (existingIdx >= 0) {
                    projects[existingIdx] = { ...projects[existingIdx], ...projectData };
                } else {
                    projects.unshift(projectData);
                }
                localStorage.setItem('myxsi_video_projects', JSON.stringify(projects));
            } catch(e) {}
        }

        // =========================================================================
        // EXPORTACIÓN DE VIDEO
        // =========================================================================
        function openExportModal() {
            pausePlayback();
            document.getElementById('exportMetaDur').innerText = `${projectState.duration.toFixed(1)}s`;
            document.getElementById('exportModal').classList.add('open');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.remove('open');
            document.getElementById('exportProgressSection').style.display = 'none';
            document.getElementById('exportSuccessBox').style.display = 'none';
            document.getElementById('btnStartExport').style.display = 'flex';
        }

        function selectExportResolution(res) {
            exportResolution = res;
            document.querySelectorAll('.export-profile-pill').forEach(p => p.classList.remove('active'));
            document.getElementById(`pill${res}`).classList.add('active');
        }

        async function startExport() {
            const startBtn = document.getElementById('btnStartExport');
            const progressSec = document.getElementById('exportProgressSection');
            const progressFill = document.getElementById('exportProgressFill');
            const percentText = document.getElementById('exportPercentText');
            const successBox = document.getElementById('exportSuccessBox');
            const downloadLink = document.getElementById('btnDirectDownload');

            startBtn.style.display = 'none';
            progressSec.style.display = 'block';

            let progress = 0;
            const stream = canvas.captureStream ? canvas.captureStream(30) : null;
            let recorder = null;
            const chunks = [];

            if (stream && window.MediaRecorder) {
                try {
                    recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                    recorder.start();
                } catch(e) {}
            }

            const exportInterval = setInterval(() => {
                progress += 5;
                if (progress > 100) progress = 100;

                progressFill.style.width = `${progress}%`;
                percentText.innerText = `${progress}%`;

                renderFrame((progress / 100) * projectState.duration);

                if (progress >= 100) {
                    clearInterval(exportInterval);

                    if (recorder && recorder.state !== 'inactive') {
                        recorder.onstop = () => {
                            const blob = new Blob(chunks, { type: 'video/webm' });
                            const url = URL.createObjectURL(blob);
                            downloadLink.href = url;
                            downloadLink.download = `${projectState.title.replace(/\s+/g, '_')}.webm`;
                            progressSec.style.display = 'none';
                            successBox.style.display = 'block';
                            downloadLink.click();
                        };
                        recorder.stop();
                    } else {
                        const url = canvas.toDataURL('image/png');
                        downloadLink.href = url;
                        downloadLink.download = `${projectState.title.replace(/\s+/g, '_')}.png`;
                        progressSec.style.display = 'none';
                        successBox.style.display = 'block';
                        downloadLink.click();
                    }
                }
            }, 60);
        }
    </script>
</body>
